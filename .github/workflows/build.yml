name: Build & Release NOVA AI Windows Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile React Frontend Application
        run: npm run build:renderer

      - name: Unpack Electron Executable Architecture
        run: npx electron-builder --win --dir

      - name: Compile True Windows Installer with Inno Setup
        uses: MarioSchwalbe/Inno-Setup-Action@v1
        with:
          filepath: setup.iss

      - name: Upload Binary Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-Setup-Windows
          path: release-installer/NOVA-AI-Setup.exe
