name: Build & Release NOVA AI Windows Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Removed 'cache: npm' so it doesn't fail when package-lock.json is absent

      - name: Install Project Dependencies
        # Changed from 'npm ci' to 'npm install'
        run: npm install

      - name: Compile React Frontend Application
        run: npm run build:renderer

      - name: Unpack Electron Executable Architecture
        run: npx electron-builder --win --dir

      - name: Install Inno Setup Compiler
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Compile True Windows Installer with Inno Setup
        shell: powershell
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compiling setup.iss using $isccPath"
          & $isccPath setup.iss

      - name: Upload Binary Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-Setup-Windows
          path: release-installer/NOVA-AI-Setup.exe
